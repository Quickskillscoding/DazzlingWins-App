name: Build & release Android app

# Every push to main builds a signed, obfuscated release APK and publishes it as the newest
# GitHub Release (tag v1.0.<run number>, asset DazzlingWins.apk). The website's footer button
# (/download/android) and the in-app updater (/api/app/version) read that release automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.27.4'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate platform folders
        run: flutter create --platforms=android,ios --org com.dazzlingwins --project-name dazzlingwins .

      - name: Configure Android project
        run: python3 scripts/prepare_android.py

      - name: Dependencies
        run: flutter pub get

      - name: App icons (from the website's brand icon)
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: |
          set -o pipefail
          if ! flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log; then
            # Put the errors on the run's summary page, so they can be read without opening the log.
            reason=$(grep -E '^ *error ' analyze.log | head -n 20 | cut -c1-400)
            reason="${reason//'%'/'%25'}"
            reason="${reason//$''/}"
            reason="${reason//$'
'/'%0A'}"
            echo "::error title=Analyze failed::${reason:-See the analyze log.}"
            exit 1
          fi

      - name: Tests
        run: flutter test

      - name: Release signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::warning::Signing secrets are not set. Building a test APK only (not published). See README → Release signing."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.p12
          {
            echo "storeFile=upload-keystore.p12"
            echo "storeType=pkcs12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: |
          set -o pipefail
          if ! flutter build apk --release \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }} \
            --obfuscate --split-debug-info=build/symbols 2>&1 | tee build.log; then
            # Put the reason on the run's summary page, so it can be read without opening the log.
            reason=$( { awk '/What went wrong/{f=1} /\* Try:/{f=0} f' build.log | head -n 30; grep -E '^e: |error:|Error: ' build.log | head -n 15; } | cut -c1-400 )
            reason="${reason//'%'/'%25'}"
            reason="${reason//$'\r'/}"
            reason="${reason//$'\n'/'%0A'}"
            echo "::error title=Android build failed::${reason:-See the build log.}"
            exit 1
          fi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/DazzlingWins.apk
          sha256sum dist/DazzlingWins.apk | tee dist/DazzlingWins.apk.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: DazzlingWins-1.0.${{ github.run_number }}
          path: dist/
          retention-days: 30

      - name: Publish release
        if: steps.signing.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DazzlingWins 1.0.${{ github.run_number }}
          # Fixed text. Never the commit message: that is developer text and must not reach players.
          body: New version of the DazzlingWins app with the latest features and fixes.
          make_latest: 'true'
          files: |
            dist/DazzlingWins.apk
            dist/DazzlingWins.apk.sha256

      - name: Clean up secrets
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.p12
