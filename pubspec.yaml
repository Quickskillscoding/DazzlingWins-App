name: dazzlingwins
description: DazzlingWins — official Android app. Same account, wallet and rules as dazzlingwins.com.
publish_to: 'none'

# CI overrides this with --build-name / --build-number (v1.0.<run number>).
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.0.2
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  webview_flutter: ^4.10.0
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.1
  workmanager: ^0.5.2
  shared_preferences: ^2.3.3
  app_links: ^6.3.3
  crypto: ^3.0.6
  # Live Chat voice notes: record (AAC/M4A) and play them back.
  record: ^5.2.1
  just_audio: ^0.9.42

# record 5.x still lists the old Linux implementation (record_linux 0.7), which no longer compiles
# against the shared record interface and breaks the Android build too. Use the fixed one.
dependency_overrides:
  record_linux: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_icon.png
  adaptive_icon_background: '#0B0B0B'
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  min_sdk_android: 21
  remove_alpha_ios: true
